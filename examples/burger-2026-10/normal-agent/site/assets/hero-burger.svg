<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" role="img" aria-labelledby="t">
  <title id="t">Illustration of a double smash burger with cheese, lettuce and tomato</title>
  <defs>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b453"/><stop offset="1" stop-color="#c97a1f"/>
    </linearGradient>
    <linearGradient id="patty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b3620"/><stop offset="1" stop-color="#3a1b0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity=".45"/><stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="260" cy="260" rx="250" ry="220" fill="url(#glow)"/>
  <ellipse cx="260" cy="440" rx="190" ry="18" fill="#000" opacity=".35"/>
  <!-- bottom bun -->
  <path d="M80 368h360v16c0 28-22 50-50 50H130c-28 0-50-22-50-50z" fill="url(#bun)"/>
  <!-- patty 2 -->
  <rect x="72" y="326" width="376" height="46" rx="23" fill="url(#patty)"/>
  <path d="M96 336c20 6 40-4 60 2s40 6 60 0 40-4 60 2 40 4 60-2 40 2 56 0" stroke="#8a4a2b" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- cheese 2 -->
  <path d="M70 318h380l-14 14-26 30-22-30-40 22-30-22-44 34-34-34-44 26-30-26-34 22-26-22z" fill="#ffc531"/>
  <!-- patty 1 -->
  <rect x="72" y="272" width="376" height="48" rx="24" fill="url(#patty)"/>
  <path d="M100 284c20 6 40-4 60 2s40 6 60 0 40-4 60 2 40 4 60-2 40 2 50 0" stroke="#8a4a2b" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- cheese 1 -->
  <path d="M66 262h388l-18 16-24 34-26-32-38 26-32-26-42 38-36-38-42 28-32-28-36 24-26-26z" fill="#ffd347"/>
  <!-- tomato -->
  <rect x="96" y="238" width="150" height="26" rx="13" fill="#e2412b"/>
  <rect x="262" y="238" width="160" height="26" rx="13" fill="#d23722"/>
  <circle cx="140" cy="251" r="4" fill="#ffb3a1"/><circle cx="196" cy="251" r="4" fill="#ffb3a1"/>
  <circle cx="310" cy="251" r="4" fill="#ffb3a1"/><circle cx="372" cy="251" r="4" fill="#ffb3a1"/>
  <!-- lettuce -->
  <path d="M62 236c14-18 28 6 44-10s28 10 44-6 30 10 46-6 30 10 46-6 28 10 46-6 30 10 46-6 30 10 44-6 22 14 30 20H58z" fill="#7cc04a"/>
  <path d="M62 236c14-18 28 6 44-10s28 10 44-6 30 10 46-6 30 10 46-6 28 10 46-6 30 10 46-6 30 10 44-6" stroke="#5a9a2e" stroke-width="4" fill="none"/>
  <!-- top bun -->
  <path d="M70 214C70 120 156 52 260 52s190 68 190 162c0 10-8 16-18 16H88c-10 0-18-6-18-16z" fill="url(#bun)"/>
  <path d="M120 120c30-40 80-56 128-56" stroke="#ffe0a3" stroke-width="10" stroke-linecap="round" fill="none" opacity=".55"/>
  <g fill="#fff3d6">
