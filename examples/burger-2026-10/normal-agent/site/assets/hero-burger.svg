    <ellipse cx="250" cy="90" rx="7" ry="4" transform="rotate(10 250 90)"/>
    <ellipse cx="310" cy="104" rx="7" ry="4" transform="rotate(25 310 104)"/>
    <ellipse cx="220" cy="144" rx="7" ry="4" transform="rotate(-5 220 144)"/>
    <ellipse cx="290" cy="150" rx="7" ry="4" transform="rotate(15 290 150)"/>
    <ellipse cx="360" cy="140" rx="7" ry="4" transform="rotate(30 360 140)"/>
    <ellipse cx="150" cy="160" rx="7" ry="4" transform="rotate(-30 150 160)"/>
    <ellipse cx="380" cy="180" rx="7" ry="4" transform="rotate(20 380 180)"/>
